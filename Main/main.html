<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio</title>

  <!-- Fuente: League Spartan (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css">
</head>

<body>

  <!-- ========== NOTAS MUSICALES DE FONDO (decoración) ========== -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="nota" viewBox="0 0 100 120">
      <path fill="currentColor" d="M38 8 L90 0 V84 a22 18 0 1 1 -12 -16 V26 L50 31 V92 a22 18 0 1 1 -12 -16 Z" />
    </symbol>
  </svg>
  <svg class="nota">
    <use href="#nota" />
  </svg>
  <svg class="nota">
    <use href="#nota" />
  </svg>
  <svg class="nota">
    <use href="#nota" />
  </svg>

  <div class="layout">

    <!-- ========== BARRA LATERAL (menú) ========== -->
    <aside class="lateral">
      <!-- Avatar: círculo + hombros dibujados en SVG -->
      <svg class="avatar" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="30" r="22" fill="#fff" />
        <path d="M6 100 C6 66 28 56 50 56 C72 56 94 66 94 100 Z" fill="#fff" />
      </svg>

      <!-- Nombre del usuario (lo rellena main.js) -->
      <p class="nombre-lateral" id="nombre-lateral"></p>

      <!-- Menú de navegación. La clase "activo" marca la página actual -->
      <nav class="menu">
        <a href="main.html" class="activo">Inicio</a>
        <a href="/Playlist/playlist.html">Playlists</a>
        <a href="/Foros/foros.html">Foros</a>
        <a href="/Login/Inicio_de_sesion/inicio_sesion.html" id="cerrar-sesion">Cerrar sesión</a>
      </nav>
    </aside>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <main class="contenido">

      <!-- Saludo -->
      <h1 class="titulo">BIEN-VENIDO <span id="nombre-titulo"></span>!</h1>

      <!-- Barra de búsqueda + botón de nueva playlist -->
      <div class="barra">
        <input type="search" id="buscador" placeholder="Títulos, Álbumes, Playlists" aria-label="Buscar">
        <button type="button" class="amarillo" id="btn-playlist">Nueva Playlist</button>
      </div>
      <!-- Canciones disponibles -->
      <section class="seccion-canciones">
        <div class="cabecera-canciones">
          <h2 class="subtitulo">CANCIONES</h2>
          <button type="button" class="amarillo" id="btn-cancion">
            + Añadir canción
          </button>
        </div>

        <div id="lista-canciones" class="lista-canciones" aria-live="polite"></div>
      </section>

      <!-- Foros recomendados -->
      <h2 class="subtitulo">FOROS RECOMENDADOS</h2>

      <!-- Filtros por género (los crea main.js) -->
      <div class="chips" id="chips" role="tablist" aria-label="Filtrar por género"></div>

      <!-- Tarjetas de foros (las crea main.js) -->
      <section class="tarjetas" id="tarjetas" aria-live="polite"></section>
    </main>
  </div>
  <!-- REPRODUCTOR DE MÚSICA -->
  <footer class="reproductor">

    <!-- Información de la canción -->
    <div class="info-reproductor">
      <h3 id="reproductor-titulo">Selecciona una canción</h3>
      <p id="reproductor-artista">Sin reproducción</p>
    </div>

    <!-- Controles principales -->
    <div class="controles-reproductor">

      <div class="botones-reproductor">
        <button id="btn-anterior" aria-label="Anterior">⏮</button>
        <button id="btn-reproducir" aria-label="Reproducir">▶</button>
        <button id="btn-siguiente" aria-label="Siguiente">⏭</button>
      </div>

      <div class="progreso-reproductor">
        <span id="tiempo-actual">0:00</span>

        <input type="range" id="progreso" min="0" max="100" value="0" aria-label="Progreso">

        <span id="tiempo-total">0:00</span>
      </div>

    </div>

    <!-- Control de volumen -->
    <div class="volumen-reproductor">
      <span>🔊</span>
      <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.75" aria-label="Volumen">
    </div>

    <!-- Elemento encargado de reproducir el MP3 -->
    <audio id="audio"></audio>

  </footer>
  
<dialog id="modal-cancion" class="modal-cancion">

    <div class="cabecera-modal">
        <h2>AÑADIR CANCIÓN</h2>
        <button type="button" id="cerrar-modal">✕</button>
    </div>

    <form id="form-cancion">

        <!-- TÍTULO -->
        <label for="titulo-can">Título de la canción</label>
        <input type="text" id="titulo-can" name="titulo_can" required>

        <!-- DURACIÓN -->
        <label for="duracion-can">Duración</label>
        <input type="text" id="duracion-can" name="duracion_can"
            placeholder="00:00:00" readonly required>

        <!-- ARTISTAS -->
        <label for="buscar-artista">Artistas</label>

        <div id="artistas-seleccionados"></div>

        <input type="text" id="buscar-artista"
            placeholder="Buscar o registrar artista..."
            autocomplete="off" maxlength="60">

        <div id="resultados-artistas" class="resultados-busqueda"></div>

        <small>El primer artista seleccionado será el principal.</small>

        <!-- ÁLBUM -->
        <label for="buscar-album">Álbum</label>

        <input type="text" id="buscar-album"
            placeholder="Selecciona primero un artista"
            autocomplete="off" maxlength="100" disabled>

        <div id="resultados-albumes" class="resultados-busqueda"></div>

        <input type="hidden" id="album-can" name="id_album">

        <!-- ARCHIVO MP3 -->
        <label for="audio-can">Archivo MP3</label>

        <input type="file" id="audio-can" name="audio"
            accept=".mp3,audio/mpeg" required>

        <small>Tamaño máximo: 20 MB.</small>

        <!-- BOTONES -->
        <div class="acciones-modal">
            <button type="button" id="cancelar-cancion">Cancelar</button>
            <button type="submit" class="amarillo">Guardar canción</button>
        </div>

    </form>

</dialog>

  <script src="main.js"></script>
</body>

</html>
