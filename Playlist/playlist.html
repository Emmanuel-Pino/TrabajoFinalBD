<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tus playlists</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../Main/main.css">
    <link rel="stylesheet" href="../Foros/foros.css">
    <link rel="stylesheet" href="playlist.css">
</head>

<body>

    <!-- ================= FONDO ================= -->

    <svg width="0" height="0" style="position:absolute">
        <symbol id="nota" viewBox="0 0 100 120">
            <path fill="currentColor"
                d="M38 8 L90 0 V84 a22 18 0 1 1 -12 -16 V26 L50 31 V92 a22 18 0 1 1 -12 -16 Z"/>
        </symbol>
    </svg>

    <svg class="nota"><use href="#nota"/></svg>
    <svg class="nota"><use href="#nota"/></svg>
    <svg class="nota"><use href="#nota"/></svg>

    <div class="forma-fondo"></div>

    <div class="layout">

        <!-- ================= BARRA LATERAL ================= -->

        <aside class="lateral">

            <svg class="avatar" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="30" r="22" fill="#fff"/>
                <path d="M6 100 C6 66 28 56 50 56 C72 56 94 66 94 100 Z"
                    fill="#fff"/>
            </svg>

            <p class="nombre-lateral" id="nombre-lateral"></p>

            <nav class="menu">

                <a href="../Main/main.html">Menu</a>

                <a href="/Playlist/playlist.html" class="activo">
                    Playlists
                </a>

                <a href="../Foros/foros.html">Foros</a>

                <a href="#" id="cerrar-sesion">
                    Cerrar sesión
                </a>

            </nav>

        </aside>

        <!-- ================= CONTENIDO PRINCIPAL ================= -->

        <main class="contenido">

            <h1 class="titulo" id="titulo-pagina">
                Tus Playlists
            </h1>

            <!-- Buscador y botón de creación -->

            <div class="barra" id="barra-playlists">

                <input
                    type="search"
                    id="buscador"
                    placeholder="Buscar playlist..."
                    aria-label="Buscar en tus playlists">

                <button
                    type="button"
                    class="amarillo"
                    id="btn-nueva">

                    + Nueva playlist

                </button>

            </div>

            <!-- Lista de playlists del usuario -->

            <section
                class="lista"
                id="lista"
                aria-live="polite">
            </section>

            <!-- ================= DETALLE DE PLAYLIST ================= -->

            <section id="detalle-playlist" hidden>

                <button
                    type="button"
                    id="btn-volver"
                    class="amarillo">

                    ← Volver a mis playlists

                </button>

                <!-- Información de la playlist -->

                <div class="cabecera-detalle">

                    <div class="portada-detalle">♫</div>

                    <div class="informacion-detalle">

                        <h2 id="detalle-titulo"></h2>

                        <p id="detalle-descripcion"></p>

                        <span id="detalle-cantidad"></span>

                    </div>

                </div>

                <!-- Cabecera de canciones -->

                <div class="barra-detalle">

                    <h2>CANCIONES</h2>

                    <button
                        type="button"
                        class="amarillo"
                        id="btn-agregar-cancion">

                        + Agregar canción

                    </button>

                </div>

                <!-- Canciones de la playlist -->

                <div id="canciones-playlist"></div>

            </section>

        </main>

    </div>

    <!-- ================= MODAL CREAR / EDITAR PLAYLIST ================= -->

    <dialog id="modal-playlist" class="modal-cancion">

        <div class="cabecera-modal">

            <h2 id="titulo-modal-playlist">
                NUEVA PLAYLIST
            </h2>

            <button type="button" id="cerrar-modal">
                ✕
            </button>

        </div>

        <form id="form-playlist">

            <label for="titulo-play">
                Título de la playlist
            </label>

            <input
                type="text"
                id="titulo-play"
                maxlength="50"
                placeholder="Mis canciones favoritas"
                required>

            <label for="descripcion-play">
                Descripción (opcional)
            </label>

            <textarea
                id="descripcion-play"
                maxlength="120"
                rows="4"
                placeholder="Describe tu playlist..."></textarea>

            <div class="acciones-modal">

                <button type="button" id="cancelar-playlist">
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="amarillo"
                    id="guardar-playlist">

                    Crear playlist

                </button>

            </div>

        </form>

    </dialog>
<dialog id="modal-agregar-cancion" class="modal-cancion">

    <div class="cabecera-modal">

        <h2>AGREGAR CANCIONES</h2>

        <button type="button" id="cerrar-modal-canciones">
            ✕
        </button>

    </div>

    <input
        type="search"
        id="buscar-cancion-playlist"
        placeholder="Buscar canción, artista o álbum..."
        autocomplete="off">

    <div id="canciones-disponibles"></div>

    <div class="acciones-modal">

        <button type="button" class="amarillo" id="finalizar-agregar">
            Listo
        </button>

    </div>

</dialog>
<footer class="reproductor" id="reproductor-playlist" hidden>

    <div class="info-reproductor">
        <h3 id="reproductor-titulo">Selecciona una canción</h3>
        <p id="reproductor-artista"></p>
    </div>

    <div class="controles-reproductor">

        <div class="botones-reproductor">
            <button type="button" id="btn-anterior">⏮</button>
            <button type="button" id="btn-reproducir">▶</button>
            <button type="button" id="btn-siguiente">⏭</button>
        </div>

        <div class="barra-progreso">
            <span id="tiempo-actual">0:00</span>
            <input type="range" id="progreso" min="0" max="100" value="0">
            <span id="tiempo-total">0:00</span>
        </div>

    </div>

    <div class="volumen-reproductor">
        <span>🔊</span>
        <input type="range" id="volumen" min="0" max="1"
            step="0.01" value="0.75">
    </div>

    <audio id="audio"></audio>

</footer>
    <!-- ================= JAVASCRIPT ================= -->

    <script src="playlist.js"></script>

</body>

</html>
